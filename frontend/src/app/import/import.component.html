@if(!isLoading && files.length != 0){ 
    <table mat-table [dataSource]="files" class="mat-elevation-z8">
            <!-- File Name Column -->
        <ng-container matColumnDef="file_name">
            <th mat-header-cell *matHeaderCellDef> File Name </th>
            <td mat-cell *matCellDef="let file"> {{file.file_name}} </td>
        </ng-container>
    
        <!-- File Size Column -->
        <ng-container matColumnDef="file_size">
            <th mat-header-cell *matHeaderCellDef> File Size (bytes) </th>
            <td mat-cell *matCellDef="let file"> {{file.file_size}} </td>
        </ng-container>
    
        <!-- Uploaded Date Column -->
        <ng-container matColumnDef="uploaded">
            <th mat-header-cell *matHeaderCellDef> Uploaded Date </th>
            <td mat-cell *matCellDef="let file"> {{file.uploaded | date: 'shortDate'}} </td>
        </ng-container>
    
        <!-- Input Field Column -->
        <ng-container matColumnDef="symbol">
            <th mat-header-cell *matHeaderCellDef> Symbol </th>
            <td mat-cell *matCellDef="let file">
                <!-- TODO maybe use the symbol-picker for safety here -->
                <mat-form-field appearance="fill">
                    <mat-label>Enter Value</mat-label>
                    <input matInput [(ngModel)]="file.symbol">
                </mat-form-field>
            </td>
        </ng-container>
    
        <!-- Import Column -->
        <ng-container matColumnDef="import">
            <th mat-header-cell *matHeaderCellDef> Import </th>
            <td mat-cell *matCellDef="let file">
                <button mat-button (click)="onImportClick(file)">Import</button>
            </td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
}

@if(isLoading || isImporting){
    <div  class="loading-indicator">
        <mat-spinner diameter="40"></mat-spinner>
    </div>
}

@if(files.length == 0 && !isLoading){
    <div class="no-files">
        <p>Upload some files in the upload tab.</p>
    </div>
}
