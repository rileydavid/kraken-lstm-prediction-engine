<div class="flex-container">
  <div class="datepicker">
    <mat-form-field appearance="fill">
      <mat-label>From Date</mat-label>
      <input matInput [ngxMatDatetimePicker]="startDateTimePicker" [(ngModel)]="fromDateTime"
        placeholder="Select from date" (ngModelChange)="onDateChange(fromDateTime, toDateTime)">
      <ngx-mat-datetime-picker #startDateTimePicker></ngx-mat-datetime-picker>
      <ngx-mat-datepicker-toggle matSuffix [for]="startDateTimePicker"></ngx-mat-datepicker-toggle>
    </mat-form-field>
  </div>
  <div class="datepicker">
    <mat-form-field appearance="fill">
      <mat-label>To Date</mat-label>
      <input matInput [ngxMatDatetimePicker]="endDateTimePicker" [(ngModel)]="toDateTime"
        placeholder="Select to date" (ngModelChange)="onDateChange(fromDateTime, toDateTime)">
      <ngx-mat-datetime-picker #endDateTimePicker></ngx-mat-datetime-picker>
      <ngx-mat-datepicker-toggle matSuffix [for]="endDateTimePicker"></ngx-mat-datepicker-toggle>
    </mat-form-field>
  </div>
</div>
