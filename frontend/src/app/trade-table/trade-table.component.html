<div *ngIf="data" class="ohlc-table-container">
    <mat-table [dataSource]="data" matSort class="mat-elevation-z8">
        <!-- TODO: Implement sorting -->
        <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef [mat-sort-header]="column"> {{ column | titlecase }} </th>
            <td mat-cell *matCellDef="let element">

                <ng-container *ngIf="column === 'time'">
                    {{ element[column] | date:'short' }}
                </ng-container>

                <ng-container *ngIf="column !== 'time'">
                    {{ element[column] }}
                </ng-container>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </mat-table>
</div>
