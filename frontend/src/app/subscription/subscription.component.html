<div class="flex-container">
    <div class="selection-row">
        <div class="container app-symbolpicker">
            <app-symbolpicker (selectedSymbolEvent)="handleSymbolEvent($event)" [symbols]="symbols"></app-symbolpicker>
        </div>
        <div class="spacer"></div>
        <div class="container app-button common-height">
            <div class="container">
                <button mat-stroked-button class="button" (click)="onButtonClick()">Add</button>
            </div>
        </div>
    </div>
</div>

@if(loadingData){
    <div class="loading-indicator">
        <mat-spinner diameter="40"></mat-spinner>
    </div>
}
