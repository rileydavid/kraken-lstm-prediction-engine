[package]
name = "service"
version = "0.1.0"
edition = "2021"

[dependencies]
utils = { path = "../utils" }
repository = { path = "../repository" }

serde = "1.0.152"
bigdecimal = {version = "0.3.1", features = ["serde"]} # sqlx compatible
chrono = {version = "0.4.31",features = ["serde"]}
tracing = "0.1.37"
openssl = { version = "0.10", features = ["vendored"] }
reqwest = { version = "0.11", features = ["json"] }