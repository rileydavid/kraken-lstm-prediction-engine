[package]
name = "webserver"
version = "0.1.0"
edition = "2021"

[dependencies]
# internal 
utils = { path = "../utils" }
service = {path = "../service"}
repository = { path = "../repository" }

# external
axum = { version = "0.7.2", features = [ "macros", "multipart"] } # "headers",
chrono = "0.4.23"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.23", features = ["macros", "rt-multi-thread", "sync"] }
tower-http = { version = "0.5.0", features = ["cors"] }
validator = { version = "0.16", features = ["derive"] }
dotenvy = "0.15"
serde_with = "3.4.0"
tracing = "0.1"
jsonwebtoken = "9.1.0"
serde_json = "1.0"
sqlx = { version = "0.7.3", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
rustis = {version = "0.12.4", features = ["redis-stack", "pool"]} 
redis = "0.24.0"