  backend: 
    build: ./backend
    container_name: backend
    restart: always
    depends_on:
      - timescaledb
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./data/import/:/import/
    networks:
      network:
        ipv4_address: ${IP_BACKEND} # 172.1.0.14

  modelservice: 
    build: ./prediction-model-execution
    container_name: modelservice
    restart: always
    ports:
      - "${MODEL_EXECUTION_PORT}:7000"
    networks:
      network:
        ipv4_address: ${IP_MODELSERVICE} # 172.1.0.15

  frontend: 
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      network:
        ipv4_address: ${IP_FRONTEND} # 172.1.0.17


